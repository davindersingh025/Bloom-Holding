<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e3d8">
<title>Bloom Super App · Owner Personas</title>
<style>
/* Brand fonts only: Matter (UI) + Orpheus Pro (display). Loaded from /fonts/ if present, else from the device. */
@font-face{font-family:"Matter";font-weight:400;font-display:swap;src:local("Matter"),local("Matter-Regular"),url("../fonts/Matter-Regular.woff2") format("woff2")}
@font-face{font-family:"Matter";font-weight:500;font-display:swap;src:local("Matter Medium"),local("Matter-Medium"),url("../fonts/Matter-Medium.woff2") format("woff2")}
@font-face{font-family:"Matter";font-weight:600;font-display:swap;src:local("Matter SemiBold"),local("Matter-SemiBold"),url("../fonts/Matter-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Matter";font-weight:700;font-display:swap;src:local("Matter Bold"),local("Matter-Bold"),url("../fonts/Matter-Bold.woff2") format("woff2")}
@font-face{font-family:"Orpheus Pro";font-weight:500;font-display:swap;src:local("Orpheus Pro Medium"),local("OrpheusPro-Medium"),url("../fonts/OrpheusPro-Medium.woff2") format("woff2")}
@font-face{font-family:"Orpheus Pro";font-weight:400;font-style:italic;font-display:swap;src:local("Orpheus Pro Italic"),local("OrpheusPro-Italic"),url("../fonts/OrpheusPro-Italic.woff2") format("woff2")}
:root{--page:#e9e3d8;--bg:#ffffff;--tile:#f3f1ea;--line:#e9e3d8;--ink:#1c1c1a;--mut:#6b665c;--pri:#922a22;--pri-d:#7a2a22;--ok:#2e7d5c;--okbg:#e7f2ec;--amb:#b88740;--ambbg:#f6eedf;
  --sans:"Matter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Orpheus Pro",Georgia,"Times New Roman",serif;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);padding:24px 16px 48px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.press{transition:transform .15s var(--ease)}.press:active{transform:scale(.97)}

/* ---------- page chrome ---------- */
.top{max-width:1000px;margin:0 auto 20px;text-align:center}
.top h1{margin:0 0 4px;font:500 30px/1.1 var(--serif);letter-spacing:-.3px}
.top p{margin:0 0 16px;font-size:14px;color:var(--mut)}
.vt{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:center;background:#ddd5c7;padding:4px;border-radius:14px}
.vt button{font-size:13px;font-weight:500;padding:9px 14px;border-radius:10px;color:var(--ink);transition:background .25s,color .25s}
.vt button small{display:block;font-size:11px;color:var(--mut);font-weight:400;margin-top:1px}
.vt button.on{background:#fff;box-shadow:0 2px 8px -3px rgba(0,0,0,.18)}
.vsel{display:none}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.note{width:320px;max-width:100%;background:#fffdf8;border-radius:16px;padding:20px;font-size:13px;line-height:1.55}
.note h2{margin:0 0 6px;font:500 22px/1.15 var(--serif)}
.note p{margin:0 0 12px;color:var(--mut)}
.note ul{margin:0 0 14px;padding-left:18px}.note li{margin-bottom:6px}
.note .lb{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8a847a;margin:16px 0 8px}
.sim{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--tile);border-radius:12px;padding:12px 14px}
.sim b{display:block;font-size:13px;font-weight:500}.sim small{color:var(--mut);font-size:11.5px}
.sk{width:44px;height:26px;border-radius:13px;background:#d9d2c5;position:relative;flex-shrink:0;transition:background .3s}
.sk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.sk.on{background:var(--pri)}.sk.on::after{transform:translateX(18px)}

/* ---------- phone ---------- */
.ph{position:relative;width:390px;max-width:100%;height:820px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 30px 70px -28px rgba(40,25,10,.45),0 0 0 9px #1c1c1a;display:flex;flex-direction:column}
.sc{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:110px}.sc::-webkit-scrollbar{display:none}
.fd{animation:fd .4s var(--ease)}@keyframes fd{from{opacity:0;transform:translateY(10px)}}
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font-weight:600;font-size:14px}
.sb span:last-child{display:flex;gap:6px;align-items:center;font-size:12px}
.pad{padding:0 16px}

/* header (replaces the red hero) */
.hd{padding:8px 16px 0}
.hrow{display:flex;align-items:center;gap:12px}
.sq{width:46px;height:46px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none;position:relative;font-size:14px;font-weight:600}
.sq em{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 2px var(--tile)}
.hi{flex:1;min-width:0}.hi small{display:block;font-size:12.5px;color:var(--mut)}.hi b{display:block;font-size:15px;font-weight:500;margin-top:2px}
.hb{height:46px;border-radius:12px;background:var(--tile);display:flex;align-items:center;padding:0 13px;overflow:hidden;transition:background .35s,color .35s}
.hb .hl{display:inline-block;max-width:0;opacity:0;white-space:nowrap;font-size:13px;font-weight:500;transition:max-width .5s var(--ease),opacity .35s,margin .5s}
.hb.open{background:var(--pri);color:#fff}.hb.open .hl{max-width:90px;opacity:1;margin-left:7px}
.hello{margin:20px 0 0;font:500 30px/1.08 var(--serif);letter-spacing:-.4px}
.hello span{color:#8a847a;font-style:italic;font-weight:400}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--tile);border-radius:12px;padding:4px;margin-top:16px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:9px;box-shadow:0 2px 8px -3px rgba(0,0,0,.18);transition:transform .4s var(--ease)}
.seg.r i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;height:42px;font-size:13.5px;font-weight:500;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:7px;transition:color .3s}
.seg button.on{color:var(--ink)}
.seg button em{font-style:normal;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;background:#fff;display:grid;place-items:center;padding:0 6px}
.seg button.on em{background:var(--tile)}

/* sections */
.sec{margin-top:28px;padding:0 16px}
.sh2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.sh2 h2{margin:0;font-size:19px;font-weight:500;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.sh2 h2 .ct{font-size:11.5px;font-weight:600;height:22px;min-width:22px;padding:0 7px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center}
.see{font-size:13.5px;color:var(--mut)}
.tagp{font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;background:var(--tile);color:var(--mut)}

/* unit card */
.ucard{background:var(--tile);border-radius:16px;padding:6px}
.utabs{display:grid;gap:4px;padding:4px;background:var(--line);border-radius:12px;margin-bottom:6px}
.utabs button{border-radius:9px;padding:7px 8px;text-align:left;min-width:0;transition:background .25s,box-shadow .25s}
.utabs button b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.utabs button small{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap}
.utabs button small i{width:6px;height:6px;border-radius:50%;background:var(--d,#b88740);flex:none}
.utabs button.on{background:#fff;box-shadow:0 2px 8px -3px rgba(0,0,0,.18)}
.uph{position:relative;height:178px;border-radius:12px;overflow:hidden}
.uph img{width:100%;height:100%;object-fit:cover;animation:imf .5s var(--ease)}
@keyframes imf{from{opacity:.3;transform:scale(1.04)}}
.utag{position:absolute;left:10px;top:10px;height:30px;padding:0 11px 0 9px;border-radius:10px;background:#fff;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.utag i{width:7px;height:7px;border-radius:50%;background:var(--d)}
.ucode{position:absolute;right:10px;top:10px;height:30px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.9);display:flex;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.ubd{background:#fff;border-radius:12px;margin-top:6px;padding:14px}
.ubd .t b{display:block;font-size:16.5px;font-weight:500;letter-spacing:-.2px}
.ubd .t small{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mut);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.chip svg{width:15px;height:15px}
.uprog{margin-top:14px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--pri);transition:width 1.2s var(--ease) .15s}
.bar.go i{width:var(--w)}
.bsm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px}
.more{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;padding-top:12px;border-top:1px solid #efeae0;font-size:13px;font-weight:500}
.more svg{width:16px;height:16px;transition:transform .35s var(--ease)}
.more.open svg{transform:rotate(180deg)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.det.open{grid-template-rows:1fr}
.det>div{overflow:hidden}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f1ece3;font-size:13px}
.kv span{color:var(--mut)}.kv b{font-weight:500;text-align:right}
.dl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#8a847a;margin:14px 0 8px}
.own{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.own .av{width:32px;height:32px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.own .x{flex:1;min-width:0}.own .x b{display:block;font-size:13px;font-weight:500}
.own .sb2{height:4px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}.own .sb2 i{display:block;height:100%;background:var(--pri)}
.own em{font-style:normal;font-size:13px;font-weight:600}
.am{display:flex;flex-wrap:wrap;gap:6px}
.am span{height:28px;padding:0 10px;border-radius:8px;background:var(--tile);display:flex;align-items:center;gap:6px;font-size:12px}
.am svg{width:14px;height:14px}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--tile);font-size:12.5px;font-weight:500;text-align:left}
.doc svg{width:18px;height:18px;color:var(--pri)}
.doc.off{opacity:.55}
.ucta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;background:#fff;border-radius:12px;padding:10px 10px 10px 14px}
.ucta small{display:block;font-size:12px;color:var(--mut)}.ucta b{font-size:15px;font-weight:600;letter-spacing:-.2px}
.btn{height:44px;padding:0 18px;border-radius:12px;background:var(--pri);color:#fff;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none}
.btn.lt{background:var(--tile);color:var(--ink)}
.btn.sm{height:38px;padding:0 14px;border-radius:10px;font-size:13px}
.btn.full{width:100%}

/* attention */
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.at{background:var(--tile);border-radius:16px;padding:12px;transition:opacity .35s,transform .35s var(--ease)}
.at.out{opacity:0;transform:translateX(30px)}
.ah{display:flex;gap:12px;align-items:center}
.aic{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;position:relative;color:var(--pri)}
.aic b{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink)}
.ah .x{flex:1;min-width:0}.ah .x b{display:block;font-size:14.5px;font-weight:500}
.ah .x small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.lvl{font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;flex:none}
.lvl.red{background:#f7e4e1;color:var(--pri)}.lvl.amb{background:var(--ambbg);color:#8f591c}
.af{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;margin-top:10px;padding:8px 8px 8px 12px}
.af .x{flex:1;min-width:0}.af .x b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.af .x small{font-size:12px;color:var(--mut)}
.af .amt{font-size:15px;font-weight:600}

/* service request */
.sr{background:var(--tile);border-radius:16px;padding:6px}
.sr .r{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px}
.sr .r .ic{width:46px;height:46px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none}
.sr .r .x{flex:1;min-width:0}.sr .r .x b{display:block;font-size:14.5px;font-weight:500}.sr .r .x small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:12px 8px 6px}
.steps div{font-size:11px;color:var(--mut)}
.steps div i{display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.steps div.on{color:var(--ink);font-weight:500}.steps div.on i{background:var(--pri)}

/* payments */
.pcard{background:var(--tile);border-radius:16px;padding:6px}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 12px}
.ptop small{display:block;font-size:12.5px;color:var(--mut)}
.ptop b{display:flex;align-items:center;gap:6px;font-size:26px;font-weight:600;letter-spacing:-.8px;margin-top:3px}
.dh{width:18px;height:16px;flex:none}
.tx{display:flex;align-items:center;gap:12px;background:#fff;padding:12px;border-bottom:1px solid #f1ece3}
.tx:first-of-type{border-radius:12px 12px 0 0}.tx:last-of-type{border-radius:0 0 12px 12px;border-bottom:0}
.tx .ic{width:40px;height:40px;border-radius:10px;background:var(--tile);display:grid;place-items:center;flex:none}
.tx .ic svg{width:18px;height:18px}
.tx .x{flex:1;min-width:0}.tx .x b{display:block;font-size:13.5px;font-weight:500}.tx .x small{display:block;font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{text-align:right;flex:none}.tx .a b{display:block;font-size:13.5px;font-weight:600}
.st{display:inline-block;font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;margin-top:3px}
.st.ok{background:var(--okbg);color:var(--ok)}.st.nt{background:var(--tile);color:var(--ink)}.st.amb{background:var(--ambbg);color:#8f591c}.st.red{background:#f7e4e1;color:var(--pri)}
.vm{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;margin-top:6px;border-radius:12px;background:#fff;font-size:13px;font-weight:500}
.vm svg{width:16px;height:16px}

/* sales updates */
.sale{position:relative;border-radius:16px;overflow:hidden;background:var(--tile);padding:6px}
.sale .im{position:relative;height:170px;border-radius:12px;overflow:hidden}
.sale .im img{width:100%;height:100%;object-fit:cover}
.sale .im span{position:absolute;left:10px;top:10px;height:28px;padding:0 10px;border-radius:9px;background:#fff;display:flex;align-items:center;font-size:11.5px;font-weight:600}
.sale .bd{display:flex;align-items:center;gap:12px;padding:12px 8px 6px}
.sale .bd .x{flex:1;min-width:0}.sale .bd b{display:block;font-size:15.5px;font-weight:500}.sale .bd small{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.srow{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:12px;padding:10px 12px;margin-top:12px;text-align:left;width:100%}
.srow .ic{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;color:var(--pri)}
.srow .x{flex:1;min-width:0}.srow b{display:block;font-size:13.5px;font-weight:500}.srow small{display:block;font-size:12px;color:var(--mut);margin-top:2px}

/* explore bloom */
.ex{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.exc{position:relative;height:104px;border-radius:12px;overflow:hidden;background:var(--tile);padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.exc .ic{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--pri)}
.exc b{font-size:14px;font-weight:500}.exc small{display:block;font-size:11.5px;color:var(--mut);font-weight:400;margin-top:2px}
.exc.big{grid-column:1/-1;height:132px;color:#fff;justify-content:flex-end}
.exc.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exc.big::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55))}
.exc.big span{position:relative;z-index:1}.exc.big small{color:rgba(255,255,255,.85)}

/* stories (phase II) */
.stories{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:500;text-align:center;line-height:1.2}
.story .rg{width:60px;height:60px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--pri),#d9a981,var(--pri))}
.story.seen .rg{background:var(--line)}
.story .rg img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid #fff;display:block}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;text-align:center}
.q .c{width:100%;aspect-ratio:1;max-width:72px;border-radius:16px;background:var(--tile);display:grid;place-items:center;color:var(--pri);transition:transform .15s}
.q:active .c{transform:scale(.92)}
.q .c svg{width:24px;height:24px}

/* nav */
.nv{position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:22px;box-shadow:0 14px 40px -10px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.04);display:flex;align-items:center;gap:4px;padding:6px;z-index:3}
.nv button{flex:1;height:54px;border-radius:16px;color:#6b665c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:500;transition:background .3s,color .3s,flex .45s var(--ease)}
.nv button svg{width:21px;height:21px}
.nv button.on{background:var(--pri);color:#fff}
.orb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9b3,#ec735c 50%,#8c3373);box-shadow:0 0 10px -2px rgba(224,97,79,.6)}

/* sub pages */
.ttl{padding:8px 16px 0}
.ttl h1{margin:6px 0 4px;font:500 30px/1.1 var(--serif);letter-spacing:-.3px}
.ttl p{margin:0;color:var(--mut);font-size:13px}
.ftabs{display:flex;gap:4px;padding:4px;background:var(--tile);border-radius:12px;margin-top:16px}
.ftabs button{flex:1;height:38px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;transition:background .25s,color .25s}
.ftabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.18)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3 div{background:var(--tile);border-radius:12px;padding:12px}
.sum3 small{display:block;font-size:11.5px;color:var(--mut)}.sum3 b{display:block;font-size:17px;font-weight:600;margin-top:4px;letter-spacing:-.3px}
